<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои деньги</title>
<meta name="apple-mobile-web-app-title" content="Мои деньги">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0E1C2B;color:#E6EEF3;
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
  img{width:96px;height:96px;border-radius:22px}
  h1{font-size:22px;margin:14px 0 6px}
  p{color:#93A8B8;margin:6px 0}
  a{display:inline-block;margin-top:16px;background:#5BB3D1;color:#0E1C2B;font-weight:600;
    padding:13px 22px;border-radius:12px;text-decoration:none}
  #setup{display:none;max-width:340px}
</style>
</head>
<body>
<div>
  <img src="apple-touch-icon.png" alt="">
  <h1>Мои деньги</h1>
  <div id="setup">
    <p>Нажмите «Поделиться» внизу Safari → <b>«На экран Домой»</b> → «Добавить».</p>
    <p>Потом открывайте с иконки: она сразу откроет ваш учёт в Claude.</p>
  </div>
  <p id="wait">Открываю…</p>
  <a href="https://claude.ai/artifact/AWVbqvpa9EPn3jwz3fftXY">Открыть</a>
</div>
<script>
  const APP = "https://claude.ai/artifact/AWVbqvpa9EPn3jwz3fftXY";
  if (location.hash === "#add") {
    // режим установки: без перехода, а адрес без #add сохранится в иконке
    history.replaceState(null, "", location.pathname);
    document.getElementById("setup").style.display = "block";
    document.getElementById("wait").style.display = "none";
  } else {
    location.replace(APP);
  }
</script>
</body>
</html>
